# ==========================================
# Cấu hình kết nối SQL Server
# ==========================================
# spring.datasource.password=${DB_PASSWORD:sand1236}
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:LucyDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:12345} 
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# HikariCP - Week 10 stress-test baseline
# ==========================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:0}
spring.datasource.hikari.pool-name=LucyHikariPool

# ==========================================
# Hibernate (JPA) cấu hình
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Logging
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# Server Port
# ==========================================
server.port=8081

# ==========================================
# File Upload
# ==========================================

# Thư mục lưu file trên server (tạo tự động nếu chưa có)
file.upload-dir=uploads/room-materials

# Base URL để trả về trong response (đổi khi deploy lên server thật)
file.base-url=http://localhost:8081/files

# Giới hạn size multipart (Spring mặc định 1MB — cần tăng lên)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# Web Servlet
# ==========================================
# Thêm dòng này để Spring Boot tự động chèn /api/v1 vào trước mọi Endpoint
server.servlet.context-path=/api/v1