# ==========================================
# Cấu hình kết nối SQL Server
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LucyDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# Hibernate (JPA) cấu hình
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2019Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Logging (tùy chọn, để debug lỗi SQL)
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
