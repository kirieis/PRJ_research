name: lucy_mobile_apps
description: "LUCY - Language Unity & Collaborative Youth Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──
  cupertino_icons: ^1.0.8

  # ── Network: REST API ──
  dio: ^5.8.0

  # ── Network: WebSocket (real-time) ──
  socket_io_client: ^3.0.2

  # ── Secure Storage (JWT token) ──
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
