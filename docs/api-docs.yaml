# docs/api-docs.yaml
# ============================================================
# Project LUCY — OpenAPI 3.0 Contract
# Version: 1.1.0 | Week 1-2 Foundation + Week 6-7 Room Management
# Philosophy: "Zero Conflict" — This schema is the single
#             source of truth for all mock data and client models.
# ============================================================

openapi: "3.0.3"

info:
  title: "LUCY — Language Learning Audio Social Network API"
  description: |
    Microservices API contract for Project LUCY.
    All services (Auth, Content, Realtime) MUST conform to this specification.
    Mock data files in the Flutter client MUST match these schemas exactly.
  version: "1.1.0"
  contact:
    name: "LUCY Dev Team"

servers:
  - url: "http://localhost:8080"
    description: "Local development (API Gateway)"
  - url: "https://api.lucy-app.dev"
    description: "Staging environment"

# ============================================================
# TAGS
# ============================================================
tags:
  - name: Auth
    description: "Authentication and authorization (Dev 6 — .NET)"
  - name: Content
    description: "Learning content management (Dev 3 — Spring Boot)"
  - name: Room Management
    description: |
      Audio room lifecycle, moderator features, and resource pinning.
      Endpoints used by Pro Dashboard and Audio Room screens.
      Auth: All endpoints require Bearer JWT.

# ============================================================
# PATHS
# ============================================================
paths:
  # ----------------------------------------------------------
  # AUTH SERVICE
  # ----------------------------------------------------------
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: "Authenticate user and obtain JWT tokens"
      description: |
        Accepts user credentials and returns a JWT access token,
        refresh token, and the authenticated user's role.
      operationId: "loginUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "learner01"
              password: "P@ssw0rd!2026"
      responses:
        "200":
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                tokenType: "Bearer"
                expiresIn: 3600
                user:
                  userId: "usr-001"
                  username: "learner01"
                  role: "LEARNER"
        "400":
          description: "Invalid request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                error: "Bad Request"
                message: "Username and password are required."
                timestamp: "2026-05-26T08:00:00.000Z"
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                error: "Unauthorized"
                message: "Invalid username or password."
                timestamp: "2026-05-26T08:00:00.000Z"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------------------------
  # CONTENT SERVICE — File Import
  # ----------------------------------------------------------
  /api/v1/import/docx:
    post:
      tags:
        - Content
      summary: "Import learning content from a DOCX file"
      description: |
        Accepts a multipart/form-data upload containing a .docx file.
        The server parses the document and creates structured learning content.
      operationId: "importDocx"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "The .docx file to import"
                title:
                  type: string
                  description: "Optional title override for the imported content"
                  example: "Daily Greetings - Module 1"
      responses:
        "201":
          description: "File imported and content created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
              example:
                importId: "imp-001"
                fileName: "greetings_module_1.docx"
                status: "COMPLETED"
                createdLevelId: "lvl-001"
                message: "Successfully imported 6 sub-levels."
                timestamp: "2026-05-26T08:00:00.000Z"
        "400":
          description: "Invalid file or unsupported format"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                error: "Bad Request"
                message: "Only .docx files are accepted."
                timestamp: "2026-05-26T08:00:00.000Z"
        "401":
          description: "Missing or invalid authentication token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------------------------
  # CONTENT SERVICE — Levels
  # ----------------------------------------------------------
  /api/v1/levels/{id}:
    get:
      tags:
        - Content
      summary: "Get a complete Level by ID"
      description: |
        Returns a single Level object representing a 60-minute learning session.
        Includes the full subLevels array with topics, durations, content, and AI prompts.
      operationId: "getLevelById"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of the Level"
          schema:
            type: string
          example: "lvl-001"
      responses:
        "200":
          description: "Level retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Level"
              example:
                levelId: "lvl-001"
                stage: 1
                title: "Daily Greetings"
                subLevels:
                  - subLevelId: "sl-001"
                    topic: "Greeting Strangers"
                    durationMinutes: 10
                    content: "Learn common phrases used when meeting someone for the first time."
                    aiPrompts:
                      - "How would you greet a stranger at a bus stop?"
                      - "Practice introducing yourself to a new classmate."
                      - "Role-play: You meet your neighbor for the first time."
                      - "What cultural differences exist in greeting strangers?"
        "401":
          description: "Missing or invalid authentication token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Level not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                error: "Not Found"
                message: "Level with id 'lvl-999' does not exist."
                timestamp: "2026-05-26T08:00:00.000Z"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------------------------
  # ROOM MANAGEMENT (Dev 5 — Week 6-7)
  # ----------------------------------------------------------
  /api/rooms:
    get:
      tags:
        - Room Management
      summary: Lấy danh sách các phòng đang active
      description: Trả về danh sách các phòng có trạng thái hoạt động (Active) hoặc đã kết thúc (Ended). Yêu cầu xác thực JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công. Trả về mảng danh sách phòng.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomItem"

  /api/rooms/{id}/pin-resource:
    post:
      tags:
        - Room Management
      summary: Pin resource vào phòng
      description: Cho phép Host hoặc Mentor ghim một tài nguyên (ảnh hoặc link) vào phòng hiện tại.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID của phòng (Room ID)
          schema:
            type: string
            example: "room_123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinResourceRequest"
      responses:
        "200":
          description: Ghim tài nguyên thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResourceResponse"
        "403":
          description: Forbidden - Người dùng không phải là Host hoặc Mentor của phòng này.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Access denied. Only host or mentor can pin resources."

  /api/rooms/{id}/moderator-hints:
    get:
      tags:
        - Room Management
      summary: Lấy gợi ý cho Moderator
      description: Lấy danh sách câu hỏi gợi ý cho Moderator/Host tại một thời điểm (phút) cụ thể trong phiên.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID của phòng (Room ID)
          schema:
            type: string
            example: "room_123"
        - name: currentMinute
          in: query
          required: true
          description: Phút hiện tại của phòng (ví dụ phiên chạy được 15 phút).
          schema:
            type: integer
            example: 15
      responses:
        "200":
          description: Lấy danh sách gợi ý thành công.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModeratorHint"

# ============================================================
# COMPONENTS
# ============================================================
components:
  # ----------------------------------------------------------
  # SECURITY SCHEMES
  # ----------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token obtained from /api/auth/login"

  # ----------------------------------------------------------
  # SCHEMAS
  # ----------------------------------------------------------
  schemas:
    # === AUTH ===
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: "User's unique username"
          example: "learner01"
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: "User's password"
          example: "P@ssw0rd!2026"

    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: "JWT access token"
        refreshToken:
          type: string
          description: "JWT refresh token for obtaining new access tokens"
        tokenType:
          type: string
          enum:
            - Bearer
          description: "Token type, always 'Bearer'"
        expiresIn:
          type: integer
          description: "Token expiry duration in seconds"
          example: 3600
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required:
        - userId
        - username
        - role
      properties:
        userId:
          type: string
          description: "Unique user identifier"
          example: "usr-001"
        username:
          type: string
          description: "User's username"
          example: "learner01"
        role:
          type: string
          enum:
            - LEARNER
            - TUTOR
            - MENTOR
            - HOST
            - ADMIN
          description: |
            User's role in the system.
            MENTOR and HOST roles grant moderator privileges (pin resources, manage speakers).
            # TODO: Confirm with Dev 6 (.NET) whether MENTOR/HOST are stored in DB
            #       or assigned dynamically per room session.
          example: "LEARNER"

    # === CONTENT — Import ===
    ImportResponse:
      type: object
      required:
        - importId
        - fileName
        - status
        - message
        - timestamp
      properties:
        importId:
          type: string
          description: "Unique identifier for the import job"
          example: "imp-001"
        fileName:
          type: string
          description: "Original uploaded file name"
          example: "greetings_module_1.docx"
        status:
          type: string
          enum:
            - COMPLETED
            - FAILED
            - PROCESSING
          description: "Import processing status"
        createdLevelId:
          type: string
          nullable: true
          description: "ID of the Level created from this import (null if failed)"
          example: "lvl-001"
        message:
          type: string
          description: "Human-readable status message"
          example: "Successfully imported 6 sub-levels."
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp of the import operation"
          example: "2026-05-26T08:00:00.000Z"

    # === CONTENT — Level ===
    Level:
      type: object
      required:
        - levelId
        - stage
        - title
        - subLevels
      properties:
        levelId:
          type: string
          description: "Unique identifier for the level"
          example: "lvl-001"
        stage:
          type: integer
          minimum: 1
          description: "Stage number in the learning path"
          example: 1
        title:
          type: string
          description: "Display title of the level"
          example: "Daily Greetings"
        subLevels:
          type: array
          description: "Ordered list of sub-levels within this level"
          items:
            $ref: "#/components/schemas/SubLevel"

    SubLevel:
      type: object
      required:
        - subLevelId
        - topic
        - durationMinutes
        - content
        - aiPrompts
      properties:
        subLevelId:
          type: string
          description: "Unique identifier for the sub-level"
          example: "sl-001"
        topic:
          type: string
          description: "Topic title for this sub-level"
          example: "Greeting Strangers"
        durationMinutes:
          type: integer
          minimum: 1
          description: "Duration of this sub-level in minutes"
          example: 10
        content:
          type: string
          description: "Learning content / instructions for this sub-level"
          example: "Learn common phrases used when meeting someone for the first time."
        aiPrompts:
          type: array
          description: "AI-generated conversation prompts for practice"
          minItems: 4
          items:
            type: string
          example:
            - "How would you greet a stranger at a bus stop?"
            - "Practice introducing yourself to a new classmate."
            - "Role-play: You meet your neighbor for the first time."
            - "What cultural differences exist in greeting strangers?"

    # === ROOM MANAGEMENT (Dev 5 — Week 6-7) ===
    RoomItem:
      type: object
      properties:
        roomId:
          type: string
          description: "Mã định danh của phòng"
          example: "room_123"
        hostId:
          type: string
          description: "Mã định danh của Host tạo phòng"
          example: "user_456"
        currentLevelId:
          type: string
          description: "Mã định danh của sub-level (hoặc chủ đề) hiện tại"
          example: "level_02"
        agoraChannelName:
          type: string
          description: "Tên kênh trên hệ thống Agora để client join vào RTC"
          example: "channel_lucy_room_123"
        status:
          type: string
          description: "Trạng thái hiện tại của phòng"
          enum: ["Active", "Ended"]
          example: "Active"

    PinResourceRequest:
      type: object
      required:
        - resourceUrl
        - type
      properties:
        resourceUrl:
          type: string
          description: "Đường dẫn của resource cần pin"
          example: "https://example.com/assets/grammar-chart.png"
        type:
          type: string
          description: "Phân loại resource"
          enum: ["image", "url"]
          example: "image"
        label:
          type: string
          description: "Tiêu đề hoặc mô tả ngắn (tuỳ chọn)"
          example: "Cấu trúc ngữ pháp tuần 2"

    PinResourceResponse:
      type: object
      properties:
        pinId:
          type: string
          description: "ID đại diện cho thao tác/bản ghi pin này"
          example: "pin_789"
        roomId:
          type: string
          description: "Phòng đang chứa resource vừa pin"
          example: "room_123"
        resourceUrl:
          type: string
          description: "Đường dẫn của resource đã được pin"
          example: "https://example.com/assets/grammar-chart.png"
        pinnedAt:
          type: string
          format: date-time
          description: "Thời điểm pin thành công (chuẩn ISO 8601)"
          example: "2026-06-02T10:30:00Z"

    ModeratorHint:
      type: object
      properties:
        hintId:
          type: string
          description: "ID của câu gợi ý"
          example: "hint_001"
        question:
          type: string
          description: "Nội dung câu hỏi/gợi ý"
          example: "Bạn đánh giá thế nào về cách tiếp cận này?"
        triggerMinute:
          type: integer
          description: "Phút sẽ xuất hiện gợi ý này kể từ lúc phòng bắt đầu"
          example: 15
        category:
          type: string
          description: "Phân loại gợi ý"
          example: "Icebreaker"

    # === SHARED — Error ===
    ErrorResponse:
      type: object
      required:
        - statusCode
        - error
        - message
        - timestamp
      properties:
        statusCode:
          type: integer
          description: "HTTP status code"
          example: 400
        error:
          type: string
          description: "Short error type description"
          example: "Bad Request"
        message:
          type: string
          description: "Human-readable error message"
          example: "The request body is invalid."
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp when the error occurred"
          example: "2026-05-26T08:00:00.000Z"
