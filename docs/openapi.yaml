openapi: 3.0.3
info:
  title: LUCY Content Service API
  description: |
    REST API cho hệ thống LUCY (Language Unity & Collaborative Youth).
    Cung cấp các endpoint quản lý nội dung học tập (LMS), import tài liệu, và xác thực người dùng.

    ## Quy ước chung
    - Tất cả response lỗi đều trả về cùng một format `ErrorResponse`.
    - Authentication sử dụng JWT Bearer Token.
    - Mọi endpoint (trừ `/api/auth/login`) đều yêu cầu token hợp lệ.

    ## Mã lỗi HTTP thống nhất
    | Mã  | Ý nghĩa              | Khi nào dùng                              |
    |-----|-----------------------|-------------------------------------------|
    | 200 | Thành công            | Request xử lý thành công                  |
    | 400 | Bad Request           | Dữ liệu đầu vào không hợp lệ             |
    | 401 | Unauthorized          | Chưa đăng nhập hoặc token hết hạn         |
    | 500 | Internal Server Error | Lỗi phía server không lường trước được    |

    ## Thành viên phụ trách
    - **Dev 1 (Nguyễn Trí Thiện)** – Swagger API Spec & Flutter Mobile
    - **Dev 3 (Trần Quốc Thịnh)** – Backend Content Service
    - **Dev 6 (Trương Bảo Tuấn)** – Backend Auth Service
  version: 1.0.0
  contact:
    name: LUCY Development Team

servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.lucy-app.com
    description: Production Server

tags:
  - name: Auth
    description: Xác thực người dùng (đăng nhập, token)
  - name: Levels
    description: Quản lý levels / bài học trong hệ thống LMS
  - name: Import
    description: Import nội dung từ file tài liệu

# ============================================================
# SECURITY SCHEMES
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token nhận được từ `/api/auth/login`.
        Gửi trong header: `Authorization: Bearer <token>`

  # ==========================================================
  # SCHEMAS
  # ==========================================================
  schemas:
    # ---------- Error ----------
    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
        - timestamp
        - path
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Tên lỗi HTTP
          example: Bad Request
        message:
          type: string
          description: Mô tả chi tiết lỗi
          example: "Trường 'email' không được để trống"
        timestamp:
          type: string
          format: date-time
          description: Thời điểm xảy ra lỗi (ISO 8601)
          example: "2026-05-21T10:00:00Z"
        path:
          type: string
          description: Đường dẫn API gây lỗi
          example: /api/auth/login

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email đăng nhập
          example: user@lucy-app.com
        password:
          type: string
          format: password
          minLength: 6
          description: Mật khẩu
          example: "mySecureP@ss123"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          description: Loại token
          example: Bearer
        expiresIn:
          type: integer
          description: Thời gian hết hạn (giây)
          example: 3600
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      description: Thông tin người dùng (không bao gồm password_hash)
      properties:
        id:
          type: integer
          description: ID người dùng
          example: 1
        email:
          type: string
          format: email
          example: user@lucy-app.com
        role:
          type: string
          enum: [LUCY, PRO, SUPER, ADMIN]
          description: "Vai trò: LUCY (free), PRO (trả phí), SUPER (host), ADMIN"
          example: LUCY
        languageId:
          type: integer
          nullable: true
          description: ID ngôn ngữ đang học
          example: 1
        displayName:
          type: string
          nullable: true
          description: Tên hiển thị
          example: "Nguyễn Văn A"
        avatarUrl:
          type: string
          nullable: true
          description: URL ảnh đại diện
          example: "https://cdn.lucy-app.com/avatars/1.jpg"
        isAnonymous:
          type: boolean
          description: Trạng thái ẩn danh (mặc định true)
          example: true
        balance:
          type: number
          format: double
          description: Số dư tài khoản
          example: 0.00
        createdAt:
          type: string
          format: date-time
          example: "2026-05-21T03:00:00Z"

    # ---------- LMS: Level ----------
    Level:
      type: object
      properties:
        id:
          type: integer
          example: 1
        languageId:
          type: integer
          description: FK → languages.id
          example: 1
        stageNumber:
          type: integer
          description: Giai đoạn (stage)
          example: 1
        levelNumber:
          type: integer
          description: Số thứ tự level trong stage
          example: 1
        topicName:
          type: string
          nullable: true
          description: Tên chủ đề
          example: "Greetings – Chào hỏi cơ bản"
        targetOutcome:
          type: string
          nullable: true
          description: Mục tiêu đầu ra
          example: "Học viên có thể chào hỏi và giới thiệu bản thân bằng tiếng Anh"
        isPublished:
          type: boolean
          description: Đã publish chưa
          example: true
        subLevels:
          type: array
          description: Danh sách sub-levels thuộc level này
          items:
            $ref: '#/components/schemas/SubLevel'

    SubLevel:
      type: object
      properties:
        id:
          type: integer
          example: 1
        levelId:
          type: integer
          description: FK → levels.id
          example: 1
        orderIndex:
          type: integer
          description: Thứ tự hiển thị
          example: 1
        title:
          type: string
          nullable: true
          example: "Hello & Goodbye"
        phonetic:
          type: string
          nullable: true
          description: Phiên âm
          example: "/həˈloʊ/"
        durationMinutes:
          type: integer
          nullable: true
          description: Thời lượng (phút)
          example: 15
        contentType:
          type: string
          description: "Loại nội dung: VOCABULARY, GRAMMAR, LISTENING, SPEAKING, ..."
          example: VOCABULARY
        contentItems:
          type: array
          description: Danh sách content items
          items:
            $ref: '#/components/schemas/ContentItem'

    ContentItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        subLevelId:
          type: integer
          example: 1
        itemType:
          type: string
          description: "Loại item: TEXT, IMAGE, AUDIO, QUESTION, ..."
          example: TEXT
        orderIndex:
          type: integer
          example: 1
        contentText:
          type: string
          nullable: true
          example: "Hello! My name is Lucy."
        phonetic:
          type: string
          nullable: true
          example: "/həˈloʊ/"

    # ---------- Import ----------
    ImportResult:
      type: object
      properties:
        message:
          type: string
          description: Thông báo kết quả
          example: "Import thành công 1 level với 3 sub-levels"
        level:
          $ref: '#/components/schemas/Level'
        totalSubLevels:
          type: integer
          description: Số sub-levels được tạo
          example: 3
        totalContentItems:
          type: integer
          description: Số content items được tạo
          example: 12

# ============================================================
# PATHS (ENDPOINTS)
# ============================================================
paths:
  # ----------------------------------------------------------
  # POST /api/auth/login
  # ----------------------------------------------------------
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập
      description: |
        Xác thực người dùng bằng email và password.
        Trả về JWT token để sử dụng cho các request tiếp theo.

        **Phụ trách:** Dev 6 (Trương Bảo Tuấn)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              normalUser:
                summary: Người dùng thường
                value:
                  email: user@lucy-app.com
                  password: "mySecureP@ss123"
              adminUser:
                summary: Admin
                value:
                  email: admin@lucy-app.com
                  password: "adminP@ss456"
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 1
                  email: user@lucy-app.com
                  role: LUCY
                  languageId: 1
                  displayName: "Nguyễn Văn A"
                  avatarUrl: null
                  isAnonymous: true
                  balance: 0.00
                  createdAt: "2026-05-21T03:00:00Z"
        '400':
          description: |
            Dữ liệu không hợp lệ:
            - Thiếu email hoặc password
            - Email không đúng format
            - Password quá ngắn (< 6 ký tự)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingEmail:
                  summary: Thiếu email
                  value:
                    status: 400
                    error: Bad Request
                    message: "Trường 'email' không được để trống"
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/auth/login
                invalidEmail:
                  summary: Email sai format
                  value:
                    status: 400
                    error: Bad Request
                    message: "Email không đúng định dạng"
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/auth/login
        '401':
          description: |
            Xác thực thất bại:
            - Email không tồn tại
            - Password không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                error: Unauthorized
                message: "Email hoặc mật khẩu không đúng"
                timestamp: "2026-05-21T10:00:00Z"
                path: /api/auth/login
        '500':
          description: Lỗi server không xác định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                error: Internal Server Error
                message: "Đã xảy ra lỗi phía server. Vui lòng thử lại sau."
                timestamp: "2026-05-21T10:00:00Z"
                path: /api/auth/login

  # ----------------------------------------------------------
  # GET /api/levels
  # ----------------------------------------------------------
  /api/levels:
    get:
      tags:
        - Levels
      summary: Lấy danh sách levels
      description: |
        Trả về danh sách tất cả levels (bao gồm sub_levels và content_items lồng nhau).
        Có thể lọc theo ngôn ngữ và trạng thái publish.

        **Phụ trách:** Dev 3 (Trần Quốc Thịnh)
      operationId: getLevels
      security:
        - BearerAuth: []
      parameters:
        - name: language_id
          in: query
          required: false
          description: Lọc theo ngôn ngữ (FK → languages.id)
          schema:
            type: integer
            example: 1
        - name: is_published
          in: query
          required: false
          description: Lọc theo trạng thái publish (true/false)
          schema:
            type: boolean
            example: true
        - name: stage_number
          in: query
          required: false
          description: Lọc theo giai đoạn (stage)
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Trả về danh sách levels thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Level'
              example:
                - id: 1
                  languageId: 1
                  stageNumber: 1
                  levelNumber: 1
                  topicName: "Greetings – Chào hỏi cơ bản"
                  targetOutcome: "Học viên có thể chào hỏi và giới thiệu bản thân"
                  isPublished: true
                  subLevels:
                    - id: 1
                      levelId: 1
                      orderIndex: 1
                      title: "Hello & Goodbye"
                      phonetic: "/həˈloʊ/"
                      durationMinutes: 15
                      contentType: VOCABULARY
                      contentItems:
                        - id: 1
                          subLevelId: 1
                          itemType: TEXT
                          orderIndex: 1
                          contentText: "Hello! My name is Lucy."
                          phonetic: "/həˈloʊ/"
                - id: 2
                  languageId: 1
                  stageNumber: 1
                  levelNumber: 2
                  topicName: "Self Introduction – Giới thiệu bản thân"
                  targetOutcome: "Học viên có thể giới thiệu tên, tuổi, quê quán"
                  isPublished: true
                  subLevels: []
        '400':
          description: |
            Query parameter không hợp lệ:
            - `language_id` không phải số nguyên
            - `stage_number` là số âm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                message: "Parameter 'language_id' phải là số nguyên dương"
                timestamp: "2026-05-21T10:00:00Z"
                path: /api/levels
        '401':
          description: |
            Chưa xác thực:
            - Không gửi Authorization header
            - Token hết hạn hoặc không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                error: Unauthorized
                message: "Token không hợp lệ hoặc đã hết hạn. Vui lòng đăng nhập lại."
                timestamp: "2026-05-21T10:00:00Z"
                path: /api/levels
        '500':
          description: Lỗi server không xác định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                error: Internal Server Error
                message: "Đã xảy ra lỗi phía server. Vui lòng thử lại sau."
                timestamp: "2026-05-21T10:00:00Z"
                path: /api/levels

  # ----------------------------------------------------------
  # POST /api/import/docx
  # ----------------------------------------------------------
  /api/import/docx:
    post:
      tags:
        - Import
      summary: Import nội dung từ file DOCX
      description: |
        Upload file `.docx` để tự động tạo level, sub_levels và content_items.
        Chỉ ADMIN mới có quyền sử dụng endpoint này.

        **Phụ trách:** Dev 3 (Trần Quốc Thịnh)

        ### Cấu trúc file DOCX yêu cầu
        - **Heading 1** → Level (topic_name)
        - **Heading 2** → Sub-level (title)
        - **Body text** → Content items
      operationId: importDocx
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - language_id
              properties:
                file:
                  type: string
                  format: binary
                  description: File DOCX cần import (max 10MB)
                language_id:
                  type: integer
                  description: ID ngôn ngữ cho nội dung import
                  example: 1
                stage_number:
                  type: integer
                  description: Giai đoạn (stage) – nếu không truyền sẽ tự detect
                  example: 1
      responses:
        '200':
          description: Import thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
              example:
                message: "Import thành công 1 level với 3 sub-levels và 12 content items"
                level:
                  id: 5
                  languageId: 1
                  stageNumber: 1
                  levelNumber: 3
                  topicName: "Daily Routines – Thói quen hàng ngày"
                  targetOutcome: "Học viên có thể mô tả thói quen hàng ngày"
                  isPublished: false
                  subLevels:
                    - id: 10
                      levelId: 5
                      orderIndex: 1
                      title: "Morning Routine"
                      phonetic: null
                      durationMinutes: 20
                      contentType: VOCABULARY
                      contentItems: []
                totalSubLevels: 3
                totalContentItems: 12
        '400':
          description: |
            Dữ liệu không hợp lệ:
            - File không phải `.docx`
            - File rỗng hoặc vượt quá 10MB
            - Thiếu `language_id`
            - `language_id` không tồn tại trong database
            - Cấu trúc file DOCX không đúng quy ước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidFormat:
                  summary: File không phải DOCX
                  value:
                    status: 400
                    error: Bad Request
                    message: "File phải có định dạng .docx"
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/import/docx
                missingLanguage:
                  summary: Thiếu language_id
                  value:
                    status: 400
                    error: Bad Request
                    message: "Trường 'language_id' là bắt buộc"
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/import/docx
                fileTooLarge:
                  summary: File quá lớn
                  value:
                    status: 400
                    error: Bad Request
                    message: "File vượt quá kích thước tối đa 10MB"
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/import/docx
        '401':
          description: |
            Không có quyền:
            - Chưa đăng nhập
            - Token hết hạn
            - Không phải role ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noToken:
                  summary: Chưa đăng nhập
                  value:
                    status: 401
                    error: Unauthorized
                    message: "Token không hợp lệ hoặc đã hết hạn. Vui lòng đăng nhập lại."
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/import/docx
                notAdmin:
                  summary: Không phải ADMIN
                  value:
                    status: 401
                    error: Unauthorized
                    message: "Bạn không có quyền thực hiện thao tác này. Yêu cầu role ADMIN."
                    timestamp: "2026-05-21T10:00:00Z"
                    path: /api/import/docx
        '500':
          description: |
            Lỗi server:
            - Lỗi khi đọc/parse file DOCX
            - Lỗi database khi lưu dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                error: Internal Server Error
                message: "Lỗi khi xử lý file DOCX. Vui lòng kiểm tra cấu trúc file và thử lại."
                timestamp: "2026-05-21T10:00:00Z"
                path: /api/import/docx
