                - pinnedBy
              properties:
                file:
                  type: string
                  format: binary
                  description: "PDF, DOCX, or Image file (max 20MB)"
                pinnedBy:
                  type: integer
                  description: "User ID of the person pinning the material"
                  example: 1
      responses:
        "201":
          description: "Material pinned successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomMaterialResponse"
        "400":
          description: "Invalid file type or size"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                error: "Bad Request"
                message: "Unsupported file type. Allowed: PDF, DOCX, IMAGE"
                timestamp: "2026-05-26T08:00:00.000Z"
        "404":
          description: "Room not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/rooms/{roomId}/materials/{matId}:
