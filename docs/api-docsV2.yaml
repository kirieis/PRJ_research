  # ----------------------------------------------------------
  # CONTENT SERVICE — Room Materials (LMS Pro)
  # ----------------------------------------------------------
  /api/v1/rooms/{roomId}/materials:
    get:
      tags:
        - Room Materials
      summary: "Get all materials pinned to a room"
      operationId: "getRoomMaterials"
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: "Materials retrieved successfully"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomMaterialResponse"
        "404":
          description: "Room not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Room Materials
      summary: "Pin a material to a room (PRO user only, max 20MB)"
      operationId: "pinMaterial"
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
