# docs/api-docs.yaml
# ============================================================
# Project LUCY — OpenAPI 3.0 Contract
# Version: 1.0.0 | Week 1-2 Foundation
# Philosophy: "Zero Conflict" — This schema is the single
#             source of truth for all mock data and client models.
# ============================================================

openapi: "3.0.3"

info:
  title: "LUCY — Language Learning Audio Social Network API"
  description: |
    Microservices API contract for Project LUCY.
    All services (Auth, Content, Realtime) MUST conform to this specification.
    Mock data files in the Flutter client MUST match these schemas exactly.
  version: "1.0.0"
  contact:
    name: "LUCY Dev Team"

servers:
  - url: "http://localhost:8080"
    description: "Local development (API Gateway)"
  - url: "https://api.lucy-app.dev"
    description: "Staging environment"

# ============================================================
# PATHS
# ============================================================
paths:

  # ----------------------------------------------------------
  # AUTH SERVICE
  # ----------------------------------------------------------
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: "Authenticate user and obtain JWT tokens"
      description: |
        Accepts user credentials and returns a JWT access token,
        refresh token, and the authenticated user's role.
      operationId: "loginUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: "learner01"
              password: "P@ssw0rd!2026"
      responses:
        "200":
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                tokenType: "Bearer"
                expiresIn: 3600
                user:
                  userId: "usr-001"
                  username: "learner01"
                  role: "LEARNER"
        "400":
          description: "Invalid request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                error: "Bad Request"
                message: "Username and password are required."
                timestamp: "2026-05-26T08:00:00.000Z"
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                error: "Unauthorized"
                message: "Invalid username or password."
                timestamp: "2026-05-26T08:00:00.000Z"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------------------------
  # CONTENT SERVICE — File Import
  # ----------------------------------------------------------
  /api/v1/import/docx:
    post:
      tags:
        - Content
      summary: "Import learning content from a DOCX file"
      description: |
        Accepts a multipart/form-data upload containing a .docx file.
        The server parses the document and creates structured learning content.
      operationId: "importDocx"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "The .docx file to import"
                title:
                  type: string
                  description: "Optional title override for the imported content"
                  example: "Daily Greetings - Module 1"
      responses:
        "201":
          description: "File imported and content created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
              example:
                importId: "imp-001"
                fileName: "greetings_module_1.docx"
                status: "COMPLETED"
                createdLevelId: "lvl-001"
                message: "Successfully imported 6 sub-levels."
                timestamp: "2026-05-26T08:00:00.000Z"
        "400":
          description: "Invalid file or unsupported format"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                error: "Bad Request"
                message: "Only .docx files are accepted."
                timestamp: "2026-05-26T08:00:00.000Z"
        "401":
          description: "Missing or invalid authentication token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------------------------
  # CONTENT SERVICE — Levels
  # ----------------------------------------------------------
  /api/v1/levels:
    get:
      tags:
        - Content
      summary: "Get levels by language, optionally filtered by stage"
      operationId: "getLevels"
      security:
        - BearerAuth: []
      parameters:
        - name: languageId
          in: query
          required: false
          schema:
            type: integer
          example: 1
        - name: stageNumber
          in: query
          required: false
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: "Levels retrieved successfully"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Level"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/levels/published:
    get:
      tags:
        - Content
      summary: "Get all published levels"
      operationId: "getPublishedLevels"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "Published levels retrieved successfully"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Level"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/levels/{id}:
    get:
      tags:
        - Content
      summary: "Get a Level by ID"
      description: "Returns a single Level object. Sub-levels are fetched separately via /api/v1/levels/{levelId}/sub-levels."
      operationId: "getLevelById"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Unique identifier of the Level"
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: "Level retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Level"
              example:
                id: 1
                stageNumber: 1
                topicName: "Daily Greetings"
                languageId: 1
                isPublished: true
        "401":
          description: "Missing or invalid authentication token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Level not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 404
                error: "Not Found"
                message: "Level not found: 999"
                timestamp: "2026-05-26T08:00:00.000Z"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/levels/{levelId}/sub-levels:
    get:
      tags:
        - Content
      summary: "Get sub-levels of a Level"
      operationId: "getSubLevelsByLevel"
      security:
        - BearerAuth: []
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: "Sub-levels retrieved successfully"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubLevel"
              example:
                - id: 1
                  topicName: "Greeting Strangers"
                  durationMinutes: 10
                  content: "Learn common phrases used when meeting someone for the first time."
        "404":
          description: "Level not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sub-levels/{subLevelId}/content-items:
    get:
      tags:
        - Content
      summary: "Get content items of a SubLevel"
      operationId: "getContentItemsBySubLevel"
      security:
        - BearerAuth: []
      parameters:
        - name: subLevelId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: "Content items retrieved successfully"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentItem"
        "404":
          description: "SubLevel not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

