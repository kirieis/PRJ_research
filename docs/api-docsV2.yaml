# ============================================================
# COMPONENTS
# ============================================================
components:

  # ----------------------------------------------------------
  # SECURITY SCHEMES
  # ----------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token obtained from /api/auth/login"

  # ----------------------------------------------------------
  # SCHEMAS
  # ----------------------------------------------------------
  schemas:

    # === AUTH ===
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: "User's unique username"
          example: "learner01"
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: "User's password"
          example: "P@ssw0rd!2026"

    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: "JWT access token"
        refreshToken:
          type: string
          description: "JWT refresh token for obtaining new access tokens"
        tokenType:
          type: string
          enum:
            - Bearer
          description: "Token type, always 'Bearer'"
        expiresIn:
          type: integer
          description: "Token expiry duration in seconds"
          example: 3600
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required:
        - userId
        - username
        - role
      properties:
        userId:
          type: string
          description: "Unique user identifier"
          example: "usr-001"
        username:
          type: string
          description: "User's username"
          example: "learner01"
        role:
          type: string
          enum:
            - LEARNER
            - TUTOR
            - ADMIN
          description: "User's role in the system"
          example: "LEARNER"

    # === CONTENT — Import ===
    ImportResponse:
      type: object
      required:
        - importId
        - fileName
        - status
        - message
        - timestamp
      properties:
        importId:
          type: string
          description: "Unique identifier for the import job"
          example: "imp-001"
        fileName:
          type: string
          description: "Original uploaded file name"
          example: "greetings_module_1.docx"
        status:
          type: string
          enum:
            - COMPLETED
            - FAILED
            - PROCESSING
          description: "Import processing status"
        createdLevelId:
          type: string
          nullable: true
          description: "ID of the Level created from this import (null if failed)"
          example: "lvl-001"
        message:
          type: string
          description: "Human-readable status message"
          example: "Successfully imported 6 sub-levels."
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp of the import operation"
          example: "2026-05-26T08:00:00.000Z"

    # === CONTENT — Level ===
    Level:
      type: object
      required:
        - id
        - stageNumber
        - topicName
      properties:
        id:
          type: integer
          description: "Unique identifier for the level"
          example: 1
        stageNumber:
          type: integer
          minimum: 1
          description: "Stage number in the learning path"
          example: 1
        topicName:
          type: string
          description: "Display title of the level"
          example: "Daily Greetings"
        languageId:
          type: integer
          description: "ID of the language this level belongs to"
          example: 1
        isPublished:
          type: boolean
          description: "Whether this level is published and visible to learners"
          example: true

    SubLevel:
      type: object
      required:
        - id
        - topicName
        - durationMinutes
      properties:
        id:
          type: integer
          description: "Unique identifier for the sub-level"
          example: 1
        topicName:
          type: string
          description: "Topic title for this sub-level"
          example: "Greeting Strangers"
        durationMinutes:
          type: integer
          minimum: 1
          description: "Duration of this sub-level in minutes"
          example: 10
        content:
          type: string
          description: "Learning content / instructions for this sub-level"
          example: "Learn common phrases used when meeting someone for the first time."

    ContentItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        subLevelId:
          type: integer
          example: 1
        content:
          type: string
          example: "Hello, nice to meet you!"

    # === CONTENT — Rooms ===
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        levelId:
          type: integer
          example: 1
        status:
          type: string
          enum:
            - LIVE
            - ENDED
            - SCHEDULED
          example: "LIVE"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-26T08:00:00.000Z"

    RoomRequest:
      type: object
      required:
        - levelId
      properties:
        levelId:
          type: integer
          example: 1

    # === CONTENT — Room Materials ===
    RoomMaterialResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        roomId:
          type: integer
          example: 1
        fileUrl:
          type: string
          example: "http://localhost:8080/files/abc-123.pdf"
        fileType:
          type: string
          enum:
            - PDF
            - DOCX
            - IMAGE
          example: "PDF"
        pinnedBy:
          type: integer
          description: "User ID of the person who pinned the material"
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-05-26T08:00:00.000Z"

    # === CONTENT — Podcasts ===
    PodcastResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Daily Greetings — Episode 1"
        description:
          type: string
          example: "A podcast about common greeting phrases."
        audioUrl:
          type: string
          example: "http://localhost:8080/files/podcast-001.mp3"
        durationSeconds:
          type: integer
          example: 600
        isPublic:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-05-26T08:00:00.000Z"
        creator:
          type: object
          properties:
            id:
              type: integer
              example: 1
            username:
              type: string
              example: "super_user_01"
        level:
          type: object
          properties:
            id:
              type: integer
              example: 1
            topicName:
              type: string
              example: "Daily Greetings"
            stageNumber:
              type: integer
              example: 1

    PodcastRequest:
      type: object
      required:
        - title
        - audioUrl
        - durationSeconds
        - creatorId
        - levelId
      properties:
        title:
          type: string
          example: "Daily Greetings — Episode 1"
        description:
          type: string
          example: "A podcast about common greeting phrases."
        audioUrl:
          type: string
          example: "http://localhost:8080/files/podcast-001.mp3"
        durationSeconds:
          type: integer
          example: 600
        isPublic:
          type: boolean
          default: true
          example: true
        creatorId:
          type: integer
          example: 1
        levelId:
          type: integer
          example: 1

    # === SHARED — Error ===
    ErrorResponse:
      type: object
      required:
        - statusCode
        - error
        - message
        - timestamp
      properties:
        statusCode:
          type: integer
          description: "HTTP status code"
          example: 400
        error:
          type: string
          description: "Short error type description"
          example: "Bad Request"
        message:
          type: string
          description: "Human-readable error message"
          example: "The request body is invalid."
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 timestamp when the error occurred"
          example: "2026-05-26T08:00:00.000Z"
